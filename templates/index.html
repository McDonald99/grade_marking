<!DOCTYPE html>
<html>
<head>
    <title>Grade Marking System</title>
    <style>
        #container { 
            min-width: 300px; 
            max-width: 1000px; 
            margin: auto
        }
        table {
            margin: auto;
            width:50%
        }
        .start { background-color: lightgray; }   /* white */
        .grade-1 { background-color: gold; }   /* light gold */
        .grade-2_1 { background-color: silver; }   /* light silver */
        .grade-2_2 { background-color:  #cd7f32; }   /* light bronze */
        .grade-Pass { background-color: green; }   /* green */
        .grade-Fail { background-color: red; }   /* red */
        .grade--1 { background-color: pink; }   /* red */
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 8px; }

    </style>
</head>
<body>
    <div id="container">
<main>
    <h1 id="h1">Grade Marking System</h1>

   
    <hr>

    <h2 id="h2">Load Student File</h2>
    <p>Enter filename (e.g., <code>students.txt</code>)</p>

    <form method="POST">
        <input type="text" id="filename" name="filename" required>
        <button id="submit-btn" type="submit">Load Results</button>
    </form>

    {% if results %}
        <h2>Class Results</h2>
        <table>
            <thead>
                <tr class="start">
                    <th>Name</th>
                    <th>Score</th>
                    <th>Grade</th>
                </tr>
            </thead>
            <tbody>
            {% for s in results %}
                <tr class="grade-{{ s.grade }}">
                    <td>{{ s.name }}</td>
                    <td>{{ s.score }}</td>
                    <td>{{ s.grade }}</td>
                </tr>
            {% endfor %}
        </table>
    {% endif %}

    {% if error %}
        <p style="color: pink">{{ error }}</p>
    {% endif %}
</main>
</div><!-- end container-->
</body>
</html>
